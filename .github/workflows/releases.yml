name: Manual Draft Release with Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create (e.g., v3.0.1)'
        required: true
        type: string
      release_name:
        description: 'Release title (optional, defaults to tag name)'
        required: false
        type: string
      prerelease:
        description: 'Mark as a pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            type: wpf
            project: Z1R_WPF/Z1R_WPF.fsproj
            asset_name: ZoraTracker-WPF-win-x64
          - os: windows-latest
            type: avalonia
            project: Z1R_Avalonia_Desktop/Z1R_Avalonia_Desktop.csproj
            rid: win-x64
            asset_name: ZoraTracker-CrossPlatform-win-x64
          - os: macos-latest
            type: avalonia
            project: Z1R_Avalonia_Desktop/Z1R_Avalonia_Desktop.csproj
            rid: osx-arm64
            asset_name: ZoraTracker-CrossPlatform-macOS-arm64
          - os: macos-latest
            type: avalonia
            project: Z1R_Avalonia_Desktop/Z1R_Avalonia_Desktop.csproj
            rid: osx-x64
            asset_name: ZoraTracker-CrossPlatform-macOS-x64
          - os: ubuntu-latest
            type: avalonia
            project: Z1R_Avalonia_Desktop/Z1R_Avalonia_Desktop.csproj
            rid: linux-x64
            asset_name: ZoraTracker-CrossPlatform-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Windows WPF (.NET Framework 4.8) Steps ---
      - name: Setup MSBuild (WPF)
        if: matrix.type == 'wpf'
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet (WPF)
        if: matrix.type == 'wpf'
        uses: nuget/setup-nuget@v2

      - name: Restore & Build Windows WPF (.NET 4.8)
        if: matrix.type == 'wpf'
        shell: pwsh
        run: |
          nuget restore Z1R_WPF.sln
          msbuild ${{ matrix.project }} /p:Configuration=Release /p:Platform=AnyCPU
          New-Item -ItemType Directory -Force -Path ./publish/${{ matrix.asset_name }}
          Copy-Item -Path ./Z1R_WPF/bin/Release/* -Destination ./publish/${{ matrix.asset_name }}/ -Recurse

      # --- Cross-Platform Avalonia (.NET 10) Steps ---
      - name: Setup .NET 10 (Avalonia)
        if: matrix.type == 'avalonia'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Avalonia Binary
        if: matrix.type == 'avalonia'
        run: >
          dotnet publish ${{ matrix.project }}
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          --output ./publish/${{ matrix.asset_name }}

      # --- Archive & Upload ---
      - name: Archive binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path ./publish/${{ matrix.asset_name }}/* -DestinationPath ./${{ matrix.asset_name }}.zip

      - name: Archive binary (macOS & Linux)
        if: matrix.os != 'windows-latest'
        run: |
          cd ./publish/${{ matrix.asset_name }}
          zip -r ../../${{ matrix.asset_name }}.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ./${{ matrix.asset_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create Draft Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name || inputs.tag }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: ./artifacts/*.zip
